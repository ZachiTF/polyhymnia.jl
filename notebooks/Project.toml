# The environment the notebooks run in, kept separate from the package itself.
#
# Polyhymnia does not depend on Pluto: nothing in `src/` imports it, and the
# widgets return `Base.HTML`, which any `text/html` renderer displays. Listing
# Pluto as a package dependency would force its whole tree on anyone using the
# library from a script, a server, or a different notebook system — so the
# notebook stack lives here instead, and `run.jl` activates this environment.
#
# Euterpe needs no `[sources]` entry here: Pkg reads the one in ../Project.toml
# through the path dependency below, pin and all.

[deps]
Pluto = "c3e4b0f8-55cb-11ea-2926-15256bba5781"
PlutoUI = "7f904dfe-b85e-4ff6-b463-dae2292396a8"
Polyhymnia = "3037db90-91f7-4a5c-9f19-df06d0736450"

[compat]
Pluto = "0.19, 0.20, 1"
PlutoUI = "0.7"
julia = "1.11"

[sources]
Polyhymnia = {path = ".."}
