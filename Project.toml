# Euterpe is not in the General registry, so a plain `Pkg.instantiate()` cannot
# find it. Pinning the commit here keeps clones and CI reproducible without a
# committed Manifest, and makes upgrading Euterpe a reviewable one-line change.
# `[sources]` requires Julia 1.11+, hence the compat bound above.
