name = "Polyhymnia"
uuid = "3037db90-91f7-4a5c-9f19-df06d0736450"
authors = ["Zacharias Häringer <Zacharias.haeringer@gmx.de>"]
version = "0.1.0"

# No Pluto here on purpose. Nothing in `src/` imports it — the widgets return
# `Base.HTML`, which any `text/html` renderer displays — so the notebook stack
# lives in `notebooks/Project.toml` and this stays usable from a plain script.
[deps]
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
Euterpe = "edad34ee-b7ef-4ff5-97e3-e3388d3c4868"
PortAudio = "80ea8bcb-4634-5cb3-8ee8-a132660d1d2d"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[compat]
PortAudio = "1"
julia = "1.11"

# Euterpe is not in the General registry, so a plain `Pkg.instantiate()` cannot
# find it. Pinning the commit here keeps clones and CI reproducible without a
# committed Manifest, and makes upgrading Euterpe a reviewable one-line change.
# `[sources]` requires Julia 1.11+, hence the compat bound above.
[sources]
Euterpe = {url = "https://github.com/SquidSinker/Euterpe.jl", rev = "8ccee3c9ae7d7383b981422f725adce5d754903b"}

[extras]
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["TOML", "Test"]
